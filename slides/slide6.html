<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>A home. A dog. A little pause. — Paws &amp; Pause</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Nunito:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap');

    :root {
      --paper: #F5E9D3;
      --paper-2: #EEDCB8;
      --ink: #3A2C22;
      --ink-soft: #6E5C49;
      --teal: #3E7C74;
      --teal-deep: #244C46;
      --marigold: #D98F2B;
      --coral: #D9705C;
      --display: "Nunito", ui-rounded, sans-serif;
      --body: "Libre Baskerville", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 12%, var(--paper-2) 0%, transparent 42%),
        radial-gradient(circle at 92% 88%, #E9D2A4 0%, transparent 46%),
        linear-gradient(145deg, #F8EFD9 0%, var(--paper) 48%, #EAD7B0 100%);
    }

    .brand {
      position: absolute;
      top: 48px;
      left: 110px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink-soft);
      font-family: var(--display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand svg { flex: 0 0 auto; }

    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 88px 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      text-align: center;
    }

    .slide::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 430px;
      height: 430px;
      top: 184px;
      left: 745px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217,143,43,0.16) 0%, rgba(217,143,43,0.07) 46%, rgba(217,143,43,0) 72%);
      animation: halo-in 1.6s ease-out both;
    }

    .closing-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-4px);
    }

    .hero-mark {
      width: 164px;
      height: 164px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(217,112,92,0.18);
      box-shadow: 0 18px 38px -25px rgba(42,30,18,0.52);
      animation: mark-in 1.35s cubic-bezier(.2,.75,.25,1) both;
    }

    .hero-mark svg { width: 108px; height: 108px; }

    h1 {
      max-width: 1160px;
      margin: 36px 0 0;
      color: var(--teal-deep);
      font-family: var(--display);
      font-size: 92px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.06;
      text-wrap: balance;
      animation: copy-in 1.15s 0.18s ease-out both;
    }

    .lede {
      max-width: 900px;
      margin: 28px auto 0;
      color: var(--ink-soft);
      font-family: var(--body);
      font-size: 29px;
      line-height: 1.5;
      text-wrap: balance;
      animation: copy-in 1.15s 0.34s ease-out both;
    }

    @keyframes halo-in {
      from { opacity: 0; transform: scale(.88); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes mark-in {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes copy-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="brand" aria-label="Paws and Pause">
    <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
      <g fill="#D9705C">
        <ellipse cx="18" cy="20" rx="6.2" ry="8.2" transform="rotate(-28 18 20)" />
        <ellipse cx="31" cy="13" rx="6.4" ry="8.1" transform="rotate(-8 31 13)" />
        <ellipse cx="45" cy="17" rx="6" ry="8.2" transform="rotate(22 45 17)" />
        <ellipse cx="51" cy="29" rx="5.5" ry="7.1" transform="rotate(42 51 29)" />
        <path d="M15 39c0-8.5 7.2-14.2 16-14.2S48 30.5 48 39c0 8.8-7.5 14-17 14S15 47.8 15 39Z" />
      </g>
    </svg>
    <span>Paws &amp; Pause</span>
  </div>

  <main class="slide">
    <div class="closing-stack">
      <div class="hero-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="#D9705C">
            <ellipse cx="18" cy="20" rx="6.2" ry="8.2" transform="rotate(-28 18 20)" />
            <ellipse cx="31" cy="13" rx="6.4" ry="8.1" transform="rotate(-8 31 13)" />
            <ellipse cx="45" cy="17" rx="6" ry="8.2" transform="rotate(22 45 17)" />
            <ellipse cx="51" cy="29" rx="5.5" ry="7.1" transform="rotate(42 51 29)" />
            <path d="M15 39c0-8.5 7.2-14.2 16-14.2S48 30.5 48 39c0 8.8-7.5 14-17 14S15 47.8 15 39Z" />
          </g>
        </svg>
      </div>
      <h1>A home. A dog. A little pause.</h1>
      <p class="lede">A home. A dog. A little pause in your day.</p>
    </div>
  </main>
</body>
</html>
