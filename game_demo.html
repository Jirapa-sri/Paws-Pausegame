<title>Paws & Pause — Playable Demo</title>
<meta name="description" content="Playable MVP demo: walk the town, earn money, adopt and care for a puppy, dress up, decorate.">
<style>
  :root{
    --paper: #F5E9D3;
    --paper-2: #EEDCB8;
    --ink: #3A2C22;
    --ink-soft: #6E5C49;
    --ink-faint: #8C7A66;
    --teal: #3E7C74;
    --teal-deep: #244C46;
    --teal-pale: #CFE1DC;
    --marigold: #D98F2B;
    --marigold-pale: #F3DBAA;
    --coral: #D9705C;
    --coral-pale: #F2D2C9;
    --line: rgba(58,44,34,0.16);
    --line-strong: rgba(58,44,34,0.32);
    --shadow: 0 14px 30px -16px rgba(42,30,18,0.5);
    --display: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI Rounded", "Nunito", sans-serif;
    --body: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 0.9rem 0.9rem 1.4rem;
  }
  ::selection{ background: var(--marigold); color: var(--teal-deep); }
  button{ font-family: inherit; cursor: pointer; }
  button:disabled{ cursor: not-allowed; opacity: 0.5; }
  button:focus-visible, [tabindex]:focus-visible{ outline: 2px solid var(--marigold); outline-offset: 2px; }

  .wrap{ width: 100%; max-width: 940px; display: flex; flex-direction: column; gap: 0.65rem; }

  .brand{
    display:flex; align-items:center; gap:0.5rem;
    font-family: var(--display); font-weight:800; font-size:1.15rem; color: var(--ink);
  }
  .brand svg{ width:20px; height:20px; }
  .brand small{ font-family: var(--mono); font-weight: 500; font-size: 0.68rem; color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 0.2rem; }

  /* HUD */
  .hud{
    display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center;
    background: rgba(255,255,255,0.5); border:1px solid var(--line); border-radius:16px;
    padding:0.6rem 0.85rem; box-shadow: var(--shadow);
  }
  .stat{ display:flex; align-items:center; gap:0.45rem; font-size:0.85rem; color: var(--ink-soft); }
  .stat b{ color: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .bar-track{ width:92px; height:9px; border-radius:6px; background: rgba(58,44,34,0.12); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; transition: width 0.25s ease; }
  .fill-energy{ background: linear-gradient(90deg, var(--marigold), #F0C36A); }
  .fill-happy{ background: linear-gradient(90deg, var(--coral), #F0A491); }
  .fill-bond{ background: linear-gradient(90deg, var(--teal), #6FAE9F); }
  .hud .spacer{ flex:1; }
  .hud-btn{
    font-family: var(--mono); font-size:0.72rem; letter-spacing:0.02em;
    background: rgba(255,255,255,0.6); border:1px solid var(--line-strong); color: var(--ink-soft);
    border-radius:8px; padding:0.35rem 0.6rem;
  }
  .hud-btn:hover:not(:disabled){ background: var(--paper-2); }

  /* Stage */
  .stage{
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    background: var(--paper-2);
    line-height: 0;
  }
  canvas{ display:block; width:100%; height:auto; touch-action: none; }

  .prompt{
    position:absolute; left:50%; bottom:14px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-family: var(--display); font-weight:600;
    font-size:0.85rem; padding:0.45rem 0.9rem; border-radius:100px; box-shadow: var(--shadow);
    display:none; align-items:center; gap:0.5rem; cursor:pointer; border:none;
  }
  .prompt kbd{
    font-family: var(--mono); font-size:0.68rem; background: rgba(245,233,211,0.18);
    border:1px solid rgba(245,233,211,0.4); border-radius:5px; padding:0.05rem 0.35rem;
  }

  .minimap-frame{
    position:absolute; top:14px; right:14px;
    border-radius:12px; overflow:hidden; border:2px solid rgba(255,255,255,0.75);
    box-shadow: var(--shadow); line-height:0;
  }
  .minimap-frame canvas{ display:block; width:150px; height:103px; }

  /* Controls row */
  .controls-row{ display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
  .hint{ font-family: var(--mono); font-size:0.72rem; color: var(--ink-faint); }
  .dpad{ display:grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 34px); gap:4px; }
  .dpad button{
    background: rgba(255,255,255,0.55); border:1px solid var(--line-strong); border-radius:9px;
    color: var(--ink); font-size:1rem; display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .dpad button:active{ background: var(--marigold-pale); }
  .dpad .up{ grid-column:2; grid-row:1; }
  .dpad .left{ grid-column:1; grid-row:2; }
  .dpad .down{ grid-column:2; grid-row:2; }
  .dpad .right{ grid-column:3; grid-row:2; }

  .move-controls{ display:flex; align-items:center; gap:0.9rem; }
  .action-buttons{ display:flex; flex-direction:column; gap:6px; }
  .round-btn{
    background: rgba(255,255,255,0.55); border:1px solid var(--line-strong); border-radius:100px;
    color: var(--ink); font-family: var(--display); font-weight:600; font-size:0.72rem;
    padding:0.4rem 0.9rem; user-select:none;
  }
  .round-btn:active, .round-btn.held{ background: var(--marigold-pale); }

  /* Toasts */
  .toasts{
    position: fixed; top: 14px; left:50%; transform: translateX(-50%);
    display:flex; flex-direction:column; gap:0.4rem; z-index:60; align-items:center; pointer-events:none;
  }
  .toast{
    font-family: var(--display); font-weight:600; font-size:0.85rem;
    background: var(--ink); color: var(--paper); padding:0.5rem 1rem; border-radius:100px;
    box-shadow: var(--shadow); opacity:0; transform: translateY(-8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{ opacity:1; transform: translateY(0); }

  /* Modal */
  .modal-backdrop{
    position: fixed; inset:0; background: rgba(58,44,34,0.42); backdrop-filter: blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:1rem;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--paper); border-radius:20px; border:1px solid var(--line);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y:auto;
    padding: 1.3rem 1.4rem 1.5rem;
  }
  .modal h3{
    font-family: var(--display); font-size:1.4rem; margin:0 0 0.2rem; color: var(--ink);
  }
  .modal .modal-sub{ font-size:0.85rem; color: var(--ink-soft); margin:0 0 0.9rem; line-height:1.5; }
  .modal-close{
    float:right; background:none; border:none; font-size:1.3rem; color: var(--ink-faint); line-height:1;
    padding:0.1rem 0.3rem;
  }

  .tabs{ display:flex; gap:0.35rem; flex-wrap:wrap; margin-bottom:0.9rem; }
  .tab-btn{
    font-family: var(--display); font-weight:600; font-size:0.8rem;
    background: rgba(255,255,255,0.5); border:1px solid var(--line-strong); color: var(--ink-soft);
    border-radius:100px; padding:0.35rem 0.85rem;
  }
  .tab-btn.active{ background: var(--teal); color:#fff; border-color: var(--teal); }
  .tab-panel{ display:flex; flex-direction:column; gap:0.9rem; }

  .swatch-row{ display:flex; flex-wrap:wrap; gap:0.5rem; }
  .swatch{
    width:34px; height:34px; border-radius:50%; border:2px solid var(--line-strong);
    position:relative;
  }
  .swatch.selected{ border-color: var(--ink); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }

  .field-label{ font-family: var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-faint); }

  .item-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap:0.55rem; }
  .item-card{
    background: rgba(255,255,255,0.5); border:1px solid var(--line); border-radius:12px;
    padding:0.5rem; display:flex; flex-direction:column; align-items:center; gap:0.35rem;
    text-align:center;
  }
  .item-card .swatch-preview{ width:38px; height:26px; border-radius:7px; border:1px solid var(--line-strong); }
  .item-card span{ font-size:0.72rem; color: var(--ink-soft); }
  .item-card button{
    width:100%; font-size:0.7rem; font-family: var(--mono); border-radius:7px; padding:0.3rem 0.4rem;
    border:1px solid var(--line-strong); background: var(--paper-2); color: var(--ink);
  }
  .item-card button.equipped{ background: var(--teal); color:#fff; border-color: var(--teal); }
  .item-card button.locked{ background: transparent; color: var(--ink-faint); }

  .room-preview{
    border-radius:14px; border:1px solid var(--line-strong); overflow:hidden; height:150px;
    position:relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
  }
  .rp-rug{ position:absolute; left:14%; right:14%; bottom:10px; height:34px; border-radius:12px; }
  .rp-furniture{ position:absolute; right:14px; top:14px; width:46px; height:58px; border-radius:8px; }
  .rp-dogbed{ position:absolute; left:16px; bottom:12px; width:56px; height:30px; border-radius:16px; }
  .rp-figure{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); }

  .action-row{ display:flex; flex-wrap:wrap; gap:0.5rem; }
  .action-btn{
    font-family: var(--display); font-weight:600; font-size:0.82rem;
    background: var(--teal); color:#fff; border:none; border-radius:10px; padding:0.55rem 0.8rem;
    flex: 1 1 100px;
  }
  .action-btn:disabled{ background: var(--ink-faint); }
  .action-btn.secondary{ background: var(--coral); }
  .action-btn.ghost{ background: rgba(255,255,255,0.55); color: var(--ink); border:1px solid var(--line-strong); }

  .flavor-box{
    background: rgba(255,255,255,0.5); border:1px solid var(--line); border-radius:12px;
    padding:0.75rem 0.9rem; font-size:0.9rem; color: var(--ink-soft); line-height:1.5;
  }

  .minigame{
    display:flex; flex-direction:column; gap:0.8rem; align-items:center; padding:0.4rem 0 0.2rem;
  }
  .track{
    position:relative; width:100%; height:34px; border-radius:12px; background: rgba(58,44,34,0.1);
    overflow:hidden;
  }
  .track .zone{ position:absolute; top:0; bottom:0; background: rgba(217,143,43,0.35); }
  .track .zone.perfect{ background: rgba(62,124,116,0.5); }
  .track .marker{
    position:absolute; top:-3px; width:6px; height:40px; background: var(--ink); border-radius:3px;
  }
  .result-text{ font-family: var(--display); font-weight:700; font-size:1.2rem; }

  .fish-pond{
    background: linear-gradient(180deg, #8FC1D6, #6FA7B8);
    border-radius:16px; height:150px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .fish-pond::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.12) 0px, transparent 6px, transparent 18px);
  }
  .bobber{
    width:22px; height:30px; border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background: var(--coral); position:relative; z-index:1;
    animation: bob 1.7s ease-in-out infinite;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .bobber::before{ content:""; position:absolute; top:-8px; left:50%; width:2px; height:10px; background:#fff; transform:translateX(-50%); }
  .bobber.biting{ animation: bite 0.22s ease-in-out infinite; background: var(--marigold); }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(8px); } }
  @keyframes bite{ 0%,100%{ transform:translateY(2px) rotate(-6deg); } 50%{ transform:translateY(12px) rotate(6deg); } }

  .race-wrap{ width:100%; border-radius:14px; overflow:hidden; box-shadow: var(--shadow); line-height:0; }
  .race-wrap canvas{ width:100%; height:auto; display:block; }

  footer.credit{
    font-family: var(--mono); font-size:0.68rem; color: var(--ink-faint); text-align:center; margin-top:0.3rem;
  }

  /* Breed picker */
  .breed-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(112px,1fr)); gap:0.6rem; }
  .breed-card{
    background:#FBF7F0; border:2px solid var(--line); border-radius:14px; padding:0.5rem;
    display:flex; flex-direction:column; align-items:center; gap:0.35rem; text-align:center;
  }
  .breed-card img{ width:84px; height:84px; object-fit:cover; border-radius:50%; border:2px solid #fff; box-shadow: var(--shadow); }
  .breed-card span{ font-family: var(--display); font-weight:600; font-size:0.78rem; color: var(--ink); }
  .breed-card.selected{ border-color: var(--teal); background:#F0F7F5; }
  .breed-card button{
    font-family: var(--mono); font-size:0.68rem; border-radius:7px; padding:0.3rem 0.5rem; width:100%;
    border:1px solid var(--line-strong); background: var(--paper-2); color: var(--ink);
  }
  .breed-card button.chosen{ background: var(--teal); color:#fff; border-color: var(--teal); }

  .pet-portrait{
    width:74px; height:74px; border-radius:50%; object-fit:cover; border:3px solid #fff;
    box-shadow: var(--shadow); background:#FBF7F0; flex-shrink:0;
  }
  .puppy-header{ display:flex; align-items:center; gap:0.9rem; }
  .puppy-header .ph-text{ display:flex; flex-direction:column; gap:0.15rem; }
  .puppy-header h4{ font-family: var(--display); font-size:1.1rem; margin:0; color: var(--ink); }
  .puppy-header .ph-meta{ font-family: var(--mono); font-size:0.72rem; color: var(--ink-faint); }
  .mood-badge{
    margin-left:auto; display:flex; flex-direction:column; align-items:center; gap:0.15rem;
    font-family: var(--mono); font-size:0.62rem; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;
  }

  /* Room preview upgrade */
  .room-preview{
    border-radius:14px; border:1px solid var(--line-strong); overflow:hidden; height:180px;
    position:relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
  }
  .rp-window{ position:absolute; left:16px; top:14px; width:64px; height:48px; border-radius:8px; background: linear-gradient(180deg,#CFE7F2,#EAF5EE); border:4px solid #fff; }
  .rp-window::before, .rp-window::after{ content:""; position:absolute; background:rgba(255,255,255,0.8); }
  .rp-window::before{ left:50%; top:0; bottom:0; width:3px; transform:translateX(-50%); }
  .rp-window::after{ top:50%; left:0; right:0; height:3px; transform:translateY(-50%); }
  .rp-rug{ position:absolute; left:12%; right:12%; bottom:10px; height:36px; border-radius:14px; }
  .rp-furniture{ position:absolute; right:16px; top:14px; width:50px; height:64px; border-radius:8px; }
  .rp-furniture::before{ content:""; position:absolute; left:6px; right:6px; top:10px; height:5px; background:rgba(255,255,255,0.5); border-radius:3px; }
  .rp-furniture::after{ content:""; position:absolute; left:6px; right:6px; top:24px; height:5px; background:rgba(255,255,255,0.5); border-radius:3px; }
  .rp-dogbed{ position:absolute; left:18px; bottom:12px; width:64px; height:34px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
  .rp-dogbed img{ width:42px; height:42px; border-radius:50%; object-fit:cover; margin-top:-22px; box-shadow: var(--shadow); }
  .rp-child{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); }

  /* Mini-game: pop rounds */
  .mg-wrap{ display:flex; flex-direction:column; gap:0.8rem; align-items:stretch; }
  .mg-timerbar{ height:8px; border-radius:6px; background: rgba(58,44,34,0.12); overflow:hidden; }
  .mg-timerfill{ height:100%; background: linear-gradient(90deg, var(--coral), var(--marigold)); transition: width 0.1s linear; }
  .mg-scoreline{ display:flex; justify-content:space-between; font-family: var(--mono); font-size:0.78rem; color: var(--ink-soft); }
  .mg-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:0.6rem; }
  .mg-tile{
    aspect-ratio: 1; border-radius:16px; background: rgba(255,255,255,0.5); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .mg-tile svg{ width:60%; height:60%; opacity:0; transform: scale(0.5); transition: opacity 0.12s ease, transform 0.12s ease; }
  .mg-tile.active{ background: var(--marigold-pale); border-color: var(--marigold); }
  .mg-tile.active svg{ opacity:1; transform: scale(1); }
  .mg-tile.hit{ background: var(--teal-pale); border-color: var(--teal); }
  .mg-tile.hit svg{ opacity:1; transform: scale(1.15); }

  .recipe-card{
    display:flex; gap:0.5rem; justify-content:center; padding:0.7rem; background: rgba(255,255,255,0.45);
    border-radius:14px; border:1px solid var(--line);
  }
  .recipe-icon{ opacity:0.35; filter: grayscale(1); transition: opacity 0.2s, filter 0.2s, transform 0.2s; }
  .recipe-icon.done{ opacity:0.5; filter: grayscale(0.6); }
  .recipe-icon.next{ opacity:1; filter: grayscale(0); transform: scale(1.25); }
  .station-tile{
    aspect-ratio:1; border-radius:16px; background: rgba(255,255,255,0.5); border:2px solid var(--line-strong);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem;
    cursor:pointer; user-select:none; transition: background 0.12s, transform 0.08s;
  }
  .station-tile span{ font-family: var(--mono); font-size:0.6rem; color: var(--ink-soft); }
  .station-tile:active{ transform: scale(0.94); background: var(--marigold-pale); }

  @media (max-width: 620px){
    .hud{ font-size:0.8rem; }
  }
</style>

<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="15" r="5.2" fill="#D9705C"/><circle cx="5.5" cy="8.5" r="2.4" fill="#D9705C"/><circle cx="18.5" cy="8.5" r="2.4" fill="#D9705C"/><circle cx="8.3" cy="4.6" r="2.1" fill="#D9705C"/><circle cx="15.7" cy="4.6" r="2.1" fill="#D9705C"/></svg>
    Paws &amp; Pause <small>Playable MVP Demo</small>
  </div>

  <div class="hud">
    <div class="stat">Day <b id="hud-day">1</b></div>
    <div class="stat">Energy
      <div class="bar-track"><div class="bar-fill fill-energy" id="hud-energy-bar" style="width:100%"></div></div>
      <b id="hud-energy-num">100</b>
    </div>
    <div class="stat">Money <b id="hud-money">$0</b></div>
    <div class="stat" id="hud-happy-wrap" style="display:none;">Happy
      <div class="bar-track"><div class="bar-fill fill-happy" id="hud-happy-bar" style="width:0%"></div></div>
    </div>
    <div class="stat" id="hud-bond-wrap" style="display:none;">Bond
      <div class="bar-track"><div class="bar-fill fill-bond" id="hud-bond-bar" style="width:0%"></div></div>
    </div>
    <div class="spacer"></div>
    <button class="hud-btn" id="btn-save">Save</button>
    <button class="hud-btn" id="btn-load">Load</button>
    <button class="hud-btn" id="btn-new">New Game</button>
  </div>

  <div class="stage">
    <canvas id="town" width="900" height="520"></canvas>
    <div class="minimap-frame"><canvas id="minimap" width="150" height="103"></canvas></div>
    <button class="prompt" id="prompt-btn"><span id="prompt-text">Enter</span> <kbd>E</kbd></button>
  </div>

  <div class="controls-row">
    <div class="hint">Move: <b>Arrow keys / WASD</b> · Run: <b>Shift</b> · Jump: <b>Space</b> · Interact: <b>E</b> or tap the prompt</div>
    <div class="move-controls">
      <div class="dpad" aria-label="Move (touch)">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="down" data-dir="down">▼</button>
        <button class="right" data-dir="right">▶</button>
      </div>
      <div class="action-buttons">
        <button class="round-btn" id="btn-run" aria-label="Run">Run</button>
        <button class="round-btn" id="btn-jump" aria-label="Jump">Jump</button>
      </div>
    </div>
  </div>

  <footer class="credit">Paws &amp; Pause — course project MVP demo · progress auto-saves to this browser</footer>
</div>

<div class="toasts" id="toasts"></div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Catalogs ---------- */

  function eyePreviewSvg(id, color){
    const head = `<circle cx="16" cy="17" r="12" fill="#F0C08A"/>`;
    let eyes;
    switch(id){
      case "sleepy": eyes = `<path d="M9 17h5M18 17h5" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`; break;
      case "sparkle": eyes = `<circle cx="11.5" cy="17" r="2.4" fill="${color}"/><circle cx="20.5" cy="17" r="2.4" fill="${color}"/><circle cx="10.5" cy="16" r="0.9" fill="#fff"/><circle cx="19.5" cy="16" r="0.9" fill="#fff"/>`; break;

      default: eyes = `<circle cx="11.5" cy="17" r="2.4" fill="${color}"/><circle cx="20.5" cy="17" r="2.4" fill="${color}"/>`;
    }
    return `<svg viewBox="0 0 32 32" width="32" height="32">${head}${eyes}</svg>`;
  }

  }

  /* ---------- Sound Effects ---------- */
  let actx = null;
  function ensureAudio(){
    if(!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  window.addEventListener("keydown", ensureAudio, { once:true });

  function beep(freq, dur, type, vol, delay){
    const ac = ensureAudio();
    if(!ac) return;
    const t0 = ac.currentTime + (delay||0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol!=null?vol:0.15, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }

  function sweep(f0, f1, dur, type, vol, delay){
    const ac = ensureAudio();
    if(!ac) return;
    const t0 = ac.currentTime + (delay||0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(f0, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t0+dur);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol!=null?vol:0.15, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }

  function noiseBurst(dur, vol){
    const ac = ensureAudio();
    if(!ac) return;
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = ac.createBufferSource();
    src.buffer = buffer;
    const gain = ac.createGain();
    gain.gain.value = vol!=null?vol:0.12;
    src.connect(gain); gain.connect(ac.destination);
    src.start();
  }

  function wobblyBlobPath(c, cx, cy, rx, ry, points, seed){
    c.beginPath();
    for(let i=0;i<=points;i++){
      const a = (i/points)*Math.PI*2;
      const wob = 1 + 0.11*Math.sin(a*3+seed) + 0.06*Math.sin(a*5+seed*1.7);
      const px = cx + Math.cos(a)*rx*wob;
      const py = cy + Math.sin(a)*ry*wob;
      if(i===0) c.moveTo(px,py); else c.lineTo(px,py);
    }
    c.closePath();
  }

    ctx.fill();
    ctx.fillStyle = "#8FC1D6";

    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    const scale = rx/175;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(cx - 20*scale + i*8*scale, cy - 10*scale + i*22*scale, Math.max(6,(46-i*10)*scale), 8*scale, 0, 0.15, Math.PI-0.15);
      ctx.stroke();
    }
    if(opts.dock){
      ctx.fillStyle = "#A9784F";
      ctx.fillRect(cx-16, cy-ry-6, 32, 46);
      ctx.strokeStyle = "rgba(58,44,34,0.3)"; ctx.lineWidth = 1.5;

    }
    ctx.restore();
  }

    ctx.translate(-camera.x, -camera.y);

    drawIslandTerrain();
    MOUNTAIN_CLUSTERS.forEach(m => drawMountainCluster(m.x, m.y, m.scale));

    ctx.strokeStyle = "#EAD9A8";
    ctx.lineWidth = 34;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(PATH_NODES[0][0], PATH_NODES[0][1]);
    for(let i=1;i<PATH_NODES.length;i++) ctx.lineTo(PATH_NODES[i][0], PATH_NODES[i][1]);
    ctx.stroke();
    ctx.strokeStyle = "rgba(58,44,34,0.08)";
    ctx.lineWidth = 34;
    ctx.stroke();

    drawPlazaHub(PLAZA_CX, PLAZA_CY);

    FLOWER_PATCHES.forEach(([fx,fy], i) => drawFlowerPatch(fx, fy, i*3.7));
    TREES.forEach(([tx,ty], i) => drawTree(tx, ty, 0.9 + seededRand(i)*0.3));

    MINI_PONDS.forEach((pd, i) => drawPond(pd.x, pd.y, pd.rx, pd.ry, { seed: 2.5+i }));
    drawLakeWater();
    DECOR_HOUSES.forEach(drawDecorHouse);
    DECOR_HUTS.forEach(h => drawHut(h.x, h.y, h.scale, h.color));

    for(const z of ZONES){
      const iconFn = ZONE_ICONS[z.icon];
      if(iconFn) iconFn(z.x + z.w/2, z.y + z.h/2);
    }

    const nowTs = performance.now();
    NPCS.forEach(npc => drawNPC(npc, nowTs));

    if(state.adopted && puppyTrail.length){
      const p = puppyTrail[0];
      drawPuppy(p.x, p.y);
    }

    drawPlayer(player.x, player.y);

    ctx.restore();
  }

  function drawPlayer(x,y){
    const isMoving = keys.up||keys.down||keys.left||keys.right;
    const bobSpeed = keys.run ? 55 : 90;
    const bob = isMoving ? Math.sin(performance.now()/bobSpeed)*(keys.run?3.2:2) : 0;

    let jumpLift = 0, squashX = 1, squashY = 1, shadowScale = 1;
    if(player.jumping){
      const t = (performance.now() - player.jumpStart) / JUMP_MS;
      if(t >= 1){ player.jumping = false; }
      else {
        const arc = Math.sin(Math.min(t,1) * Math.PI);
        jumpLift = arc * 22;
        squashY = 1 + arc*0.14;
        squashX = 1 - arc*0.1;
        shadowScale = 1 - arc*0.4;
      }
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(58,44,34,0.18)";
    ctx.beginPath(); ctx.ellipse(0, 4, 12*shadowScale, 5*shadowScale, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y + bob - jumpLift);
    ctx.scale(squashX, squashY);
    drawClothingShape(state.child.clothing, state.child.outfit);
    ctx.beginPath(); ctx.arc(0,-14,12,0,Math.PI*2); ctx.fillStyle = state.child.skin; ctx.fill();
    drawFace(state.child.eyeStyle, state.child.eyeColor, state.child.mouthStyle);
    drawHairShape(state.child.hairstyle, state.child.hair);
    ctx.restore();
  }

  function drawFace(eyeStyle, eyeColor, mouthStyle){
    ctx.save();
    ctx.translate(0, -14);
    switch(eyeStyle){
      case "sleepy":
        ctx.strokeStyle = eyeColor; ctx.lineWidth = 1.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-6,-1); ctx.lineTo(-2,-1); ctx.moveTo(2,-1); ctx.lineTo(6,-1); ctx.stroke();
        break;
      case "sparkle":
        ctx.fillStyle = eyeColor;
        ctx.beginPath(); ctx.arc(-4,-1,1.8,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4,-1,1.8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(-4.6,-1.6,0.7,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3.4,-1.6,0.7,0,Math.PI*2); ctx.fill();
        break;
      case "wink":
        ctx.fillStyle = eyeColor;
        ctx.beginPath(); ctx.arc(-4,-1,1.8,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = eyeColor; ctx.lineWidth = 1.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(2,-1); ctx.lineTo(6,-1); ctx.stroke();
        break;
      default:
        ctx.fillStyle = eyeColor;
        ctx.beginPath(); ctx.arc(-4,-1,1.8,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4,-1,1.8,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = "#7A5A4A"; ctx.lineWidth = 1.3; ctx.lineCap = "round";
    switch(mouthStyle){
      case "neutral":
        ctx.beginPath(); ctx.moveTo(-3,5); ctx.lineTo(3,5); ctx.stroke();
        break;
      case "open":
        ctx.fillStyle = "#B5654A";
        ctx.beginPath(); ctx.ellipse(0,5.5,3,2.2,0,0,Math.PI*2); ctx.fill();
        break;
      default:
        ctx.beginPath(); ctx.moveTo(-4,4); ctx.quadraticCurveTo(0,7.5,4,4); ctx.stroke();
    }
    ctx.restore();
  }

  function drawClothingShape(styleId, color){
    ctx.fillStyle = color;
    switch(styleId){
      case "dress":
        ctx.beginPath();
        ctx.moveTo(-7,-4); ctx.lineTo(7,-4); ctx.lineTo(15,17); ctx.quadraticCurveTo(0,23,-15,17); ctx.closePath();
        ctx.fill();
        break;
      case "overalls":
        roundRect(-11,-4,22,22,8); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.fillRect(-7,-3,3,10); ctx.fillRect(4,-3,3,10);
        break;
      case "hoodie":
        roundRect(-12,-6,24,26,10); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.beginPath(); ctx.arc(0,-6,7,0,Math.PI); ctx.fill();
        break;
      default:
        roundRect(-11,-4,22,22,8); ctx.fill();
    }
  }

  function drawHairShape(styleId, color){
    ctx.fillStyle = color;
    switch(styleId){
      case "long":
        ctx.beginPath(); ctx.arc(0,-19,12,Math.PI*1.05,Math.PI*1.95); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-11,-4,4,13,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(11,-4,4,13,0,0,Math.PI*2); ctx.fill();
        break;
      case "pigtails":
        ctx.beginPath(); ctx.arc(0,-19,12,Math.PI*1.05,Math.PI*1.95); ctx.fill();
        ctx.beginPath(); ctx.arc(-13,-9,5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(13,-9,5,0,Math.PI*2); ctx.fill();
        break;
      case "curly":
        ctx.beginPath(); ctx.arc(0,-19,12,Math.PI*1.05,Math.PI*1.95); ctx.fill();
        [[-9,-25],[0,-28],[9,-25],[-5,-23],[5,-23]].forEach(([bx,by]) => { ctx.beginPath(); ctx.arc(bx,by,5,0,Math.PI*2); ctx.fill(); });
        break;
      case "cap":
        ctx.beginPath(); ctx.arc(0,-16,12.5,Math.PI,Math.PI*2); ctx.fill();
        ctx.fillRect(-13,-16,26,3);
        ctx.beginPath(); ctx.ellipse(9,-13,7,3,0,0,Math.PI*2); ctx.fill();
        break;
      default:
        ctx.beginPath(); ctx.arc(0,-19,12,Math.PI*1.05,Math.PI*1.95); ctx.fill();
    }
  }

  function drawPuppy(x,y){
    const breed = state.puppy.breed;
    const img = breed && breedImages[breed];
    ctx.save();
    ctx.translate(x, y);
    if(img && img.complete && img.naturalWidth){
      ctx.beginPath();
      ctx.arc(0, 2, 15, 0, Math.PI*2);
      ctx.closePath();
      ctx.save();
      ctx.clip();
      ctx.drawImage(img, -15, -13, 30, 30);
      ctx.restore();
      ctx.strokeStyle = state.puppy.accessory; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,10,6,0.15,Math.PI-0.15); ctx.stroke();
    } else {
      ctx.fillStyle = "#C8935B";
      ctx.beginPath(); ctx.ellipse(0,4,13,8,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(12,2,6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-11,0,7,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    drawMoodBubble(x+13, y-17, state.happiness);
  }

  function drawMoodBubble(x, y, happiness){
    const curve = (happiness-50)/50;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#FFF7EA";
    ctx.strokeStyle = "rgba(58,44,34,0.25)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#3A2C22";
    ctx.beginPath(); ctx.arc(-3,-1,0.9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3,-1,0.9,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#3A2C22"; ctx.lineWidth = 1.2; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-3.5,2);
    ctx.quadraticCurveTo(0, 2 + curve*3.5, 3.5, 2);
    ctx.stroke();
    ctx.restore();
  }

  function update(dt){
    if(gameMode !== "town") return;
    let dx=0, dy=0;
    if(keys.up) dy -= 1;
    if(keys.down) dy += 1;
    if(keys.left) dx -= 1;
    if(keys.right) dx += 1;
    const moving = dx!==0 || dy!==0;
    if(moving){
      const len = Math.hypot(dx,dy) || 1;
      const speed = player.speed * (keys.run ? 1.7 : 1);
      player.x += (dx/len) * speed * dt;
      player.y += (dy/len) * speed * dt;
      player.x = Math.max(player.r, Math.min(WORLD_W-player.r, player.x));
      player.y = Math.max(player.r, Math.min(WORLD_H-player.r, player.y));

      movingAccumMs += dt*1000 * (keys.run ? 1.6 : 1);
      if(movingAccumMs >= 2200){
        movingAccumMs = 0;
        setEnergy(state.energy - 1);
      }

      footstepAccumMs += dt*1000;
      const stepInterval = keys.run ? 250 : 340;
      if(footstepAccumMs >= stepInterval){
        footstepAccumMs = 0;
        if(keys.run) SFX.stepRun(); else SFX.stepWalk();
      }

      if(state.adopted){
        puppyTrail.push({x:player.x, y:player.y});
        if(puppyTrail.length > 18) puppyTrail.shift();
      }
    } else {
      footstepAccumMs = 0;
    }

    const nowTs2 = performance.now();
    NPCS.forEach(npc => computeNpcPos(npc, nowTs2));
    let nearNpc = null, bestD = 40;
    NPCS.forEach(npc => {
      const d = Math.hypot(player.x-npc.x, player.y-npc.y);
      if(d < bestD){ bestD = d; nearNpc = npc; }
    });
    const z = zoneAt(player.x, player.y);
    const newTarget = nearNpc ? { kind:"npc", ref:nearNpc } : (z ? { kind:"zone", ref:z } : null);
    const changed = (newTarget?.kind !== currentTarget?.kind) || (newTarget?.ref !== currentTarget?.ref);
    if(changed){
      currentTarget = newTarget;
      const promptBtn = document.getElementById("prompt-btn");
      const promptText = document.getElementById("prompt-text");
      if(newTarget && newTarget.kind === "zone"){
        promptText.textContent = "Enter " + newTarget.ref.label;
        promptBtn.style.display = "flex";
      } else if(newTarget && newTarget.kind === "npc"){
        promptText.textContent = "Talk to " + newTarget.ref.name;
        promptBtn.style.display = "flex";
      } else {
        promptBtn.style.display = "none";
      }
    }
  }

  function computeNpcPos(npc, t){
    npc.x = npc.homeX + Math.sin(t/npc.speed + npc.phase) * npc.range;
    npc.y = npc.homeY + Math.cos(t/(npc.speed*1.3) + npc.phase) * (npc.range*0.55);
  }

  function interactWithTarget(){
    if(!currentTarget || gameMode !== "town") return;
    if(currentTarget.kind === "zone") enterZone(currentTarget.ref);
    else if(currentTarget.kind === "npc") openNpcDialogue(currentTarget.ref);
  }

  function openNpcDialogue(npc){
    SFX.enterZone();
    const line = npc.lines[Math.floor(Math.random()*npc.lines.length)];
    openModal(`
      <h3>${escapeHtml(npc.name)}</h3>
      <div class="flavor-box">"${escapeHtml(line)}"</div>
      <div class="action-row"><button class="action-btn ghost" id="npc-bye">Wave Goodbye</button></div>
    `);
    document.getElementById("npc-bye").addEventListener("click", closeModal);
  }

  function drawHousePin(c, cx, cy, color){
    c.save();
    c.translate(cx, cy);
    c.fillStyle = "rgba(58,44,34,0.32)";
    c.beginPath(); c.ellipse(0,4.5,5,1.8,0,0,Math.PI*2); c.fill();
    c.fillStyle = color;
    c.fillRect(-4,-1,8,6);
    c.beginPath(); c.moveTo(-5.2,-1); c.lineTo(0,-7.5); c.lineTo(5.2,-1); c.closePath(); c.fill();
    c.restore();
  }

  function drawMinimap(){
    const sx = MW / WORLD_W, sy = MH / WORLD_H;
    mctx.clearRect(0,0,MW,MH);
    mctx.fillStyle = "#8FD3DE";
    mctx.fillRect(0,0,MW,MH);
    mctx.fillStyle = "#B9D98C";
    mctx.beginPath();
    mctx.ellipse(MW/2, MH/2, MW/2-4, MH/2-4, 0, 0, Math.PI*2);
    mctx.fill();

    mctx.strokeStyle = "rgba(234,217,168,0.9)";
    mctx.lineWidth = 3;
    mctx.lineCap = "round"; mctx.lineJoin = "round";
    mctx.beginPath();
    PATH_NODES.forEach(([px,py], i) => {
      const mx = px*sx, my = py*sy;
      if(i===0) mctx.moveTo(mx,my); else mctx.lineTo(mx,my);
    });
    mctx.stroke();

    ZONES.forEach(z => drawHousePin(mctx, (z.x+z.w/2)*sx, (z.y+z.h/2)*sy, z.fill));

    mctx.strokeStyle = "rgba(255,255,255,0.85)";
    mctx.lineWidth = 1.5;
    mctx.strokeRect(camera.x*sx, camera.y*sy, W*sx, H*sy);

    mctx.fillStyle = state.child.outfit;
    mctx.beginPath(); mctx.arc(player.x*sx, player.y*sy, 3.4, 0, Math.PI*2); mctx.fill();
    mctx.strokeStyle = "#fff"; mctx.lineWidth = 1.2;
    mctx.beginPath(); mctx.arc(player.x*sx, player.y*sy, 3.4, 0, Math.PI*2); mctx.stroke();
  }

  function loop(ts){
    if(lastTime === null) lastTime = ts;
    const dt = Math.min(0.05, (ts - lastTime)/1000);
    lastTime = ts;
    update(dt);
    drawScene();
    drawMinimap();
    requestAnimationFrame(loop);
  }

  function setEnergy(v){
    state.energy = Math.max(0, Math.min(state.maxEnergy, v));
    updateHud();
  }

  /* ---------- Input ---------- */
  const KEY_MAP = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
                    w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right" };
  function triggerJump(){
    if(!player.jumping){ player.jumping = true; player.jumpStart = performance.now(); SFX.jump(); }
  }
  window.addEventListener("keydown", (e) => {
    if(KEY_MAP[e.key]){ keys[KEY_MAP[e.key]] = true; e.preventDefault(); }
    if(e.key === "Shift"){ keys.run = true; }
    if(e.key === " "){ e.preventDefault(); triggerJump(); }
    if(e.key === "e" || e.key === "E"){ interactWithTarget(); }
  });
  window.addEventListener("keyup", (e) => {
    if(KEY_MAP[e.key]){ keys[KEY_MAP[e.key]] = false; }
    if(e.key === "Shift"){ keys.run = false; }
  });
  document.querySelectorAll(".dpad button").forEach(btn => {
    const dir = btn.dataset.dir;
    const on = (e) => { e.preventDefault(); keys[dir] = true; };
    const off = (e) => { e.preventDefault(); keys[dir] = false; };
    btn.addEventListener("pointerdown", on);
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointerleave", off);
    btn.addEventListener("pointercancel", off);
  });
  const runBtn = document.getElementById("btn-run");
  runBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); keys.run = true; runBtn.classList.add("held"); });
  runBtn.addEventListener("pointerup", () => { keys.run = false; runBtn.classList.remove("held"); });
  runBtn.addEventListener("pointerleave", () => { keys.run = false; runBtn.classList.remove("held"); });
  runBtn.addEventListener("pointercancel", () => { keys.run = false; runBtn.classList.remove("held"); });
  document.getElementById("btn-jump").addEventListener("click", triggerJump);
  document.getElementById("prompt-btn").addEventListener("click", interactWithTarget);

  /* ---------- Modal system ---------- */
  const backdrop = document.getElementById("modal-backdrop");
  const modalBody = document.getElementById("modal-body");
  let modalCleanup = null;
  function openModal(html){
    if(modalCleanup){ modalCleanup(); modalCleanup = null; }
    modalBody.innerHTML = html;
    backdrop.classList.add("open");
  }
  function closeModal(){
    if(modalCleanup){ modalCleanup(); modalCleanup = null; }
    backdrop.classList.remove("open");
    modalBody.innerHTML = "";
  }
  document.getElementById("modal-close").addEventListener("click", closeModal);
  backdrop.addEventListener("click", (e) => { if(e.target === backdrop) closeModal(); });

  function enterZone(z){
    SFX.enterZone();
    if(z.id === "home") openHome();
    else if(z.id === "cafe") openJob();
    else if(z.id === "lake") openFishing();
    else if(z.id === "shelter") openShelter();
    else if(z.id === "stadium") openStadium();
    else if(z.id === "arcade") openArcade();
  }

  /* ---------- Home hub ---------- */
  let homeTab = "sleep";
  function openHome(){
    renderHome();
  }
  function renderHome(){
    const tabs = [["sleep","Sleep"], ["me","Me"], ["room","My Room"]];
    if(state.adopted) tabs.push(["puppy","Puppy"]);
    const tabsHtml = tabs.map(([id,label]) =>
      `<button class="tab-btn ${homeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join("");

    let panel = "";
    if(homeTab === "sleep") panel = sleepPanel();
    else if(homeTab === "me") panel = mePanel();
    else if(homeTab === "room") panel = roomPanel();
    else if(homeTab === "puppy") panel = puppyPanel();

    openModal(`
      <h3>Home</h3>
      <p class="modal-sub">Your room, your look, and your best friend — all under one roof.</p>
      <div class="tabs">${tabsHtml}</div>
      <div class="tab-panel">${panel}</div>
    `);

    modalBody.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => {
      homeTab = b.dataset.tab; renderHome();
    }));
    wirePanel();
  }

  function sleepPanel(){
    return `
      <div class="flavor-box">You feel ${state.energy < 30 ? "pretty tired" : state.energy < 70 ? "a little worn out" : "still pretty energetic"}. Sleeping restores full energy and starts a new day.</div>
      <div class="action-row"><button class="action-btn" id="btn-sleep">Sleep — Start Day ${state.day+1}</button></div>

  function swatchRow(colors, current){
    return colors.map(c => `<button class="swatch ${c===current?'selected':''}" style="background:${c}" data-color="${c}"></button>`).join("");
  }
  function styleCategory(options, group, currentId, previewFn, color){
    return options.map(opt => {
      const active = opt.id === currentId;
      return `<div class="item-card">
        ${previewFn(opt.id, color)}
        <span>${opt.name}</span>
        <button class="${active?'equipped':''}" data-style-group="${group}" data-style-id="${opt.id}">${active?'Selected':'Select'}</button>
      </div>`;
    }).join("");

  function roomPanel(){
    const eq = state.equipped;
    const puppyImg = state.adopted && BREEDS[state.puppy.breed] ? BREEDS[state.puppy.breed].img : "";
    return `
      <div class="room-preview" style="background:${colorOf('wallpaper',eq.wallpaper)}">

        <div class="rp-child">${childAvatarSvg()}</div>
      </div>
      ${decorCategory("wallpaper","Wallpaper")}
      ${decorCategory("rug","Rug")}
      ${decorCategory("furniture","Furniture")}
      ${state.adopted ? decorCategory("dogbed","Dog Bed") : ""}
    `;
  }
  function childAvatarSvg(){
    return `<svg width="30" height="34" viewBox="0 0 30 34">
      <rect x="4" y="14" width="22" height="20" rx="8" fill="${state.child.outfit}"/>
      <circle cx="15" cy="11" r="10" fill="${state.child.skin}"/>
      <path d="M4 11 A11 11 0 0 1 26 11 A16 9 0 0 0 4 11 Z" fill="${state.child.hair}"/>
    </svg>`;
  }
  function colorOf(cat,id){ const item = DECOR[cat].find(i=>i.id===id); return item ? item.color : "#ccc"; }
  function decorCategory(cat, label){
    const items = DECOR[cat].map(item => {
      const owned = state.owned[cat].includes(item.id);
      const equipped = state.equipped[cat] === item.id;
      let btnLabel = owned ? (equipped ? "Equipped" : "Equip") : ("$" + item.price);
      let cls = equipped ? "equipped" : (owned ? "" : (state.money < item.price ? "locked" : ""));
      return `<div class="item-card">
        <div class="swatch-preview" style="background:${item.color}"></div>

      </div>`;
    }).join("");
    return `<div class="field-label">${label}</div><div class="item-grid">${items}</div>`;
  }
  function moodInfo(happiness){
    if(happiness>=80) return { label:"Ecstatic",
      eyes:`<path d="M8 10q2-3 4 0M16 10q2-3 4 0" stroke="#3A2C22" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
      mouth:`<path d="M9 14.5q5 6 11 0" stroke="#3A2C22" stroke-width="1.8" fill="none" stroke-linecap="round"/>` };
    if(happiness>=55) return { label:"Happy",
      eyes:`<circle cx="9" cy="10" r="1.5" fill="#3A2C22"/><circle cx="19" cy="10" r="1.5" fill="#3A2C22"/>`,
      mouth:`<path d="M9 13.5q5 4.5 11 0" stroke="#3A2C22" stroke-width="1.8" fill="none" stroke-linecap="round"/>` };
    if(happiness>=30) return { label:"Content",
      eyes:`<circle cx="9" cy="10" r="1.5" fill="#3A2C22"/><circle cx="19" cy="10" r="1.5" fill="#3A2C22"/>`,
      mouth:`<path d="M10 14q4 1.6 8 0" stroke="#3A2C22" stroke-width="1.8" fill="none" stroke-linecap="round"/>` };
    if(happiness>=10) return { label:"Sad",
      eyes:`<circle cx="9" cy="10.5" r="1.5" fill="#3A2C22"/><circle cx="19" cy="10.5" r="1.5" fill="#3A2C22"/>`,
      mouth:`<path d="M9 15.5q5-4 11 0" stroke="#3A2C22" stroke-width="1.8" fill="none" stroke-linecap="round"/>` };
    return { label:"Very Sad",
      eyes:`<circle cx="9" cy="10.5" r="1.5" fill="#3A2C22"/><circle cx="19" cy="10.5" r="1.5" fill="#3A2C22"/>`,
      mouth:`<path d="M9 16q5-5 11 0" stroke="#3A2C22" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M19.5 12.5q1.4 2.6 -0.3 3.8" stroke="#7C97C2" stroke-width="1.5" fill="none" stroke-linecap="round"/>` };
  }
  function moodFaceSvg(happiness, size){

    return `<svg viewBox="0 0 28 22" width="${size}" height="${h}">

  function careAction(energyCost, happyGain, bondGain, moneyCost, sfxFn){
    if(state.energy < energyCost){ toast("Too tired for that right now"); return; }
    if(state.money < moneyCost){ toast("Not enough money"); return; }
    state.money -= moneyCost;
    setEnergy(state.energy - energyCost);
    state.happiness = Math.min(100, state.happiness + happyGain);
    state.bond = state.bond + bondGain;
    state.caredToday = true;
    if(sfxFn) sfxFn();
    saveState(true);
    updateHud();
    renderHome();
  }

  function doSleep(){
    if(state.adopted && !state.caredToday){
      state.happiness = Math.max(0, state.happiness - 8);
      toast("Your puppy missed you today...");
    }
    state.energy = state.maxEnergy;
    state.day += 1;
    state.caredToday = false;
    SFX.sleep();
    saveState(true);
    updateHud();
    closeModal();
    toast("A new day begins — Day " + state.day);
  }

  /* ---------- Fishing (Lake) ---------- */
  const FISH_SPECIES = [
    { id:"minnow",  name:"Minnow",      color:"#B8C4D9", rarity:"Common",   value:3,  weight:34 },
    { id:"bass",    name:"Bass",        color:"#6B8E6B", rarity:"Common",   value:5,  weight:28 },
    { id:"catfish", name:"Catfish",     color:"#8C7A66", rarity:"Uncommon", value:8,  weight:18 },
    { id:"koi",     name:"Koi",         color:"#E3998A", rarity:"Uncommon", value:10, weight:12 },
    { id:"eel",     name:"Eel",         color:"#4A4A4A", rarity:"Rare",     value:16, weight:6  },
    { id:"golden",  name:"Golden Carp", color:"#E8A33D", rarity:"Rare",     value:22, weight:2  },
  ];
  function fishSvg(color){
    return `<svg viewBox="0 0 24 24" width="30" height="30"><path d="M3 12c3-4 8-6 12-4l4 4-4 4c-4 2-9 0-12-4Z" fill="${color}"/><circle cx="15" cy="10.5" r="1" fill="#fff"/><path d="M3 12l-2.4-2.2m2.4 2.2l-2.4 2.2" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  }
  function weightedFish(){
    const total = FISH_SPECIES.reduce((s,f)=>s+f.weight,0);
    let r = Math.random()*total;
    for(const f of FISH_SPECIES){ if(r < f.weight) return f; r -= f.weight; }
    return FISH_SPECIES[0];
  }
  /* ---------- Café: cooking job ---------- */
  const COOK_STATIONS = [
    { id:"bread", name:"Bread",  color:"#D9A066" },
    { id:"veg",   name:"Veggie", color:"#6B8E6B" },
    { id:"grill", name:"Grill",  color:"#B5654A" },
    { id:"plate", name:"Plate",  color:"#CFE7F2" },
  ];
  function stationIconSvg(id, color){
    switch(id){
      case "veg": return `<svg viewBox="0 0 24 24" width="26" height="26"><circle cx="8" cy="9" r="5" fill="${color}"/><circle cx="15" cy="7" r="4" fill="${color}"/><circle cx="16" cy="13" r="5" fill="${color}"/></svg>`;
      case "grill": return `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 2c2 3-1 4-1 6a3 3 0 0 0 6 0c0-1-1-2-1-3 2 2 3 5 3 7a6 6 0 0 1-12 0c0-4 3-6 5-10Z" fill="${color}"/></svg>`;
      case "plate": return `<svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="9" fill="${color}"/><circle cx="12" cy="12" r="5.5" fill="#fff" opacity="0.5"/></svg>`;
      default: return `<svg viewBox="0 0 24 24" width="26" height="26"><rect x="4" y="9" width="16" height="9" rx="4.5" fill="${color}"/><rect x="4" y="7" width="16" height="6" rx="3" fill="${color}" opacity="0.7"/></svg>`;
    }
  }
  function makeRecipe(len){
    const seq = [];
    for(let i=0;i<len;i++) seq.push(COOK_STATIONS[Math.floor(Math.random()*COOK_STATIONS.length)].id);
    return seq;
  }

  function openJob(){
    if(state.energy < 10){
      openModal(`<h3>Café — Cook the Order</h3><div class="flavor-box">You're too tired to work right now. Head home and sleep to restore energy.</div>`);
      return;
    }
    openModal(`
      <h3>Café — Cook the Order</h3>
      <p class="modal-sub">Tap the stations in the order shown on the ticket, before time runs out.</p>
      <div class="mg-scoreline"><span>Order <b id="ck-order-num">1</b> / 4</span><span>Tips: $<b id="ck-money">0</b></span></div>
      <div class="mg-timerbar"><div class="mg-timerfill" id="ck-timerfill" style="width:100%"></div></div>
      <div class="recipe-card" id="ck-recipe"></div>
      <div class="mg-grid" id="ck-stations" style="grid-template-columns:repeat(4,1fr);">
        ${COOK_STATIONS.map(s => `<div class="station-tile" data-id="${s.id}">${stationIconSvg(s.id, s.color)}<span>${s.name}</span></div>`).join("")}
      </div>
    `);
    startCooking();
  }

  function startCooking(){
    const ORDERS_TOTAL = 4;
    let orderNum = 1;
    let sequence = [];
    let stepIdx = 0;
    let sessionMoney = 0;
    let ended = false;
    let tickInterval = null;
    let deadline = 0;
    const DURATION = 11000;

    const recipeEl = document.getElementById("ck-recipe");
    const timerFill = document.getElementById("ck-timerfill");
    const orderNumEl = document.getElementById("ck-order-num");
    const moneyEl = document.getElementById("ck-money");

    function renderRecipe(){
      recipeEl.innerHTML = sequence.map((id,i) => {
        const st = COOK_STATIONS.find(s=>s.id===id);
        const cls = i < stepIdx ? "done" : (i === stepIdx ? "next" : "");
        return `<div class="recipe-icon ${cls}">${stationIconSvg(id, st.color)}</div>`;
      }).join("");
    }

    function newOrder(){
      if(orderNum > ORDERS_TOTAL){ finishCooking(); return; }
      orderNumEl.textContent = orderNum;
      sequence = makeRecipe(3 + Math.min(2, Math.floor(orderNum/2)));
      stepIdx = 0;
      deadline = performance.now() + DURATION;
      renderRecipe();
    }

    function onStationClick(e){
      if(ended) return;
      const id = e.currentTarget.dataset.id;
      if(id === sequence[stepIdx]){
        stepIdx++;
        SFX.hit();
        renderRecipe();
        if(stepIdx >= sequence.length){
          const remainingFrac = Math.max(0, (deadline - performance.now())/DURATION);
          const tip = 4 + Math.round(remainingFrac*6);
          sessionMoney += tip;
          state.money += tip;
          updateHud();
          moneyEl.textContent = sessionMoney;
          SFX.purchase();
          orderNum++;
          setTimeout(newOrder, 500);
        }
      }
    }
    document.querySelectorAll(".station-tile").forEach(t => t.addEventListener("click", onStationClick));

    tickInterval = setInterval(() => {
      if(ended) return;
      const remaining = Math.max(0, deadline - performance.now());
      timerFill.style.width = (remaining/DURATION*100) + "%";
      if(remaining <= 0){
        orderNum++;
        newOrder();
      }
    }, 100);

    function cleanup(){
      ended = true;
      clearInterval(tickInterval);
    }
    modalCleanup = cleanup;

    function finishCooking(){
      cleanup();
      setEnergy(state.energy - 10);
      saveState(true);
      modalBody.innerHTML = `
        <h3>Café — Cook the Order</h3>
        <div class="result-text">Shift complete!</div>
        <div class="flavor-box">You earned $${sessionMoney} in tips.</div>
        <div class="action-row">
          <button class="action-btn ghost" id="ck-again">Work Again</button>
          <button class="action-btn" id="ck-done">Done</button>
        </div>
      `;
      document.getElementById("ck-done").addEventListener("click", closeModal);
      document.getElementById("ck-again").addEventListener("click", openJob);
    }

    newOrder();
  }

  /* ---------- Fishing minigame ---------- */

  function renderFishingShell(){

    openModal(`

          </div>`;

  function startFishingSession(){
    const CASTS_TOTAL = 5;
    let castNum = 1;
    let phase = "idle";
    let biteTimeout = null, nextTimeout = null;
    let ended = false;
    let totalMoney = 0, totalCaught = 0;

    function setStatus(text){ const el = document.getElementById("fish-status"); if(el) el.textContent = text; }
    function setBobber(cls){ const el = document.getElementById("fish-bobber"); if(el) el.className = "bobber" + (cls ? " " + cls : ""); }
    function setCastNum(n){ const el = document.getElementById("fish-cast-num"); if(el) el.textContent = n; }

    function doCast(){
      if(ended) return;
      if(castNum > CASTS_TOTAL){ finishSession(); return; }
      setCastNum(castNum);
      phase = "waiting";
      setStatus("Waiting for a bite…");
      setBobber("");
      const waitMs = 1200 + Math.random()*2200;
      biteTimeout = setTimeout(() => {
        if(ended) return;
        phase = "bite";
        setStatus("Bite!! Reel in now!");
        setBobber("biting");
        SFX.hit();
        biteTimeout = setTimeout(() => {
          if(ended) return;
          phase = "missed";
          setStatus("It got away…");
          setBobber("");
          castNum++;
          nextTimeout = setTimeout(doCast, 900);
        }, 700);
      }, waitMs);
    }

    function onReel(){
      if(ended) return;
      if(phase === "bite"){
        clearTimeout(biteTimeout);
        const fish = weightedFish();
        const isNew = !state.fishCollection[fish.id];
        state.fishCollection[fish.id] = (state.fishCollection[fish.id]||0) + 1;
        totalMoney += fish.value;
        totalCaught++;
        state.money += fish.value;
        saveState(true);
        updateHud();
        setStatus(`${isNew ? "New catch! " : ""}${fish.name} (+$${fish.value})`);
        setBobber("");
        castNum++;
        nextTimeout = setTimeout(doCast, 1100);
      } else if(phase === "waiting" || phase === "idle"){
        setStatus("Too soon — it swam away!");
        castNum++;
        nextTimeout = setTimeout(doCast, 900);
      }
    }

    const reelBtn = document.getElementById("btn-reel");
    reelBtn.addEventListener("click", onReel);

    function cleanup(){
      ended = true;
      clearTimeout(biteTimeout);
      clearTimeout(nextTimeout);
    }
    modalCleanup = cleanup;

    function finishSession(){
      cleanup();
      setEnergy(state.energy - 10);
      saveState(true);
      const panel = document.getElementById("fish-game-panel");
      if(panel) panel.innerHTML = `
        <div class="result-text">${totalCaught} fish caught!</div>
        <div class="flavor-box">You earned $${totalMoney} from this trip.</div>
        <div class="action-row">
          <button class="action-btn ghost" id="fish-again">Fish Again</button>
          <button class="action-btn" id="fish-done">Done</button>
        </div>
      `;
      const doneBtn = document.getElementById("fish-done");
      const againBtn = document.getElementById("fish-again");
      if(doneBtn) doneBtn.addEventListener("click", closeModal);
      if(againBtn) againBtn.addEventListener("click", openFishing);
    }

    doCast();
  }

      <p class="modal-sub">What will you name your ${breed.name.toLowerCase()}?</p>
      <div style="text-align:center; margin-bottom:0.9rem;"><img class="pet-portrait" style="width:100px;height:100px;" src="${breed.img}" alt="${breed.name}"></div>
      <input type="text" id="name-input" maxlength="16" placeholder="Buddy" style="width:100%; padding:0.6rem 0.7rem; border-radius:10px; border:1px solid var(--line-strong); font-family:var(--body); font-size:1rem; margin-bottom:0.9rem;">
      <div class="action-row"><button class="action-btn secondary" id="btn-confirm-adopt">Bring Them Home</button></div>
    `);
    document.getElementById("btn-confirm-adopt").addEventListener("click", () => {
      const val = document.getElementById("name-input").value.trim();
      finalizeAdoption(val || "Buddy", breedId);
    });
  }

  function finalizeAdoption(name, breedId){
    const traits = ["Playful","Shy","Energetic","Sleepy"];
    state.money -= ADOPT_COST;
    state.adopted = true;
    state.puppyName = name;
    state.puppy.breed = breedId;
    state.trait = traits[Math.floor(Math.random()*traits.length)];
    state.happiness = 60;
    state.bond = 0;
    state.caredToday = false;
    puppyTrail.length = 0;
    for(let i=0;i<18;i++) puppyTrail.push({x:player.x-20, y:player.y});
    SFX.adopt();
    saveState(true);
    updateHud();
    closeModal();
    toast(name + " (" + state.trait + ") is home!");
  }

  /* ---------- Go-Kart Stadium ---------- */
  const RACE_W = 700, RACE_H = 420;
  const RACE_CX = 350, RACE_CY = 195, RACE_RX = 280, RACE_RY = 140;
  const LAPS_TOTAL = 3;
  const BOOST_PADS = [1.0, -1.8];
  const BOOST_ARC = 0.16;

  function openStadium(){
    if(state.energy < 15){
      openModal(`<h3>Go-Kart Stadium</h3><div class="flavor-box">You're too tired to race right now. Head home and sleep to restore energy.</div>`);
      return;
    }
    openModal(`
      <h3>Go-Kart Stadium</h3>
      <p class="modal-sub">3 laps, 2 rivals, a couple of boost pads. Arrows/WASD to drive.</p>
      <div class="race-wrap">
        <canvas id="race-canvas" width="${RACE_W}" height="${RACE_H}"></canvas>
      </div>
      <div class="hint" style="margin-top:0.6rem;">Up/W: Accelerate · Down/S: Brake · Left/Right or A/D: Steer</div>
    `);
    startRace();
  }

  function makeKart(color){
    return { theta:0, lastTheta:null, totalTheta:0, x:0, y:0, angle:Math.PI/2, speed:0, boostUntil:0, lastBoostPad:-1, color };
  }

  function startRace(){
    gameMode = "race";
    const canvas2 = document.getElementById("race-canvas");
    const c2 = canvas2.getContext("2d");

    const player2 = makeKart(state.child.outfit);
    player2.x = RACE_CX + RACE_RX; player2.y = RACE_CY;
    const ai1 = makeKart("#5A7FB0"); ai1.theta = -0.15; ai1.angularSpeed = 0.58 + Math.random()*0.08; ai1.lateral = 0.9;
    const ai2 = makeKart("#D98F2B"); ai2.theta = -0.30; ai2.angularSpeed = 0.52 + Math.random()*0.08; ai2.lateral = 1.12;
    const karts = [player2, ai1, ai2];

    let phase = "countdown";
    let countdown = 3;
    let raceEnded = false;
    let raf = null;
    let last = null;

    const countdownTimer = setInterval(() => {
      countdown--;
      if(countdown <= 0){
        clearInterval(countdownTimer);
        phase = "racing";
      }
    }, 800);

    function unwrapProgress(obj, theta){
      if(obj.lastTheta === null){ obj.lastTheta = theta; return; }
      let delta = theta - obj.lastTheta;
      if(delta > Math.PI) delta -= Math.PI*2;
      if(delta < -Math.PI) delta += Math.PI*2;
      obj.totalTheta += delta;
      obj.lastTheta = theta;
    }

    function checkBoost(kart, nowTs){
      for(let i=0;i<BOOST_PADS.length;i++){
        let d = Math.abs(kart.theta - BOOST_PADS[i]);
        if(d > Math.PI) d = Math.PI*2 - d;
        if(d < BOOST_ARC && kart.lastBoostPad !== i){
          kart.lastBoostPad = i;
          kart.boostUntil = nowTs + 1300;
          if(kart === player2) SFX.jump();
        }
      }
      if(kart.theta > -0.3 && kart.theta < 0.3){ kart.lastBoostPad = -1; }
    }

    function updatePlayerKart(dt, nowTs){
      const maxSpeed = (nowTs < player2.boostUntil) ? 340 : 230;
      if(keys.up) player2.speed = Math.min(maxSpeed, player2.speed + 300*dt);
      else if(keys.down) player2.speed = Math.max(-100, player2.speed - 340*dt);
      else {
        if(player2.speed > 0) player2.speed = Math.max(0, player2.speed - 190*dt);
        else if(player2.speed < 0) player2.speed = Math.min(0, player2.speed + 190*dt);
      }
      const turnScale = Math.max(0.2, Math.min(1, Math.abs(player2.speed)/120));
      const turnDir = player2.speed >= 0 ? 1 : -1;
      if(keys.left) player2.angle -= 2.6*turnScale*turnDir*dt;
      if(keys.right) player2.angle += 2.6*turnScale*turnDir*dt;

      player2.x += Math.cos(player2.angle) * player2.speed * dt;
      player2.y += Math.sin(player2.angle) * player2.speed * dt;

      const nx = (player2.x - RACE_CX)/RACE_RX, ny = (player2.y - RACE_CY)/RACE_RY;
      const radial = Math.hypot(nx, ny);
      player2.theta = Math.atan2(ny, nx);
      if(radial < 0.7 || radial > 1.3) player2.speed *= (1 - 1.6*dt);

      unwrapProgress(player2, player2.theta);
      checkBoost(player2, nowTs);
    }

    function updateAiKart(ai, dt, nowTs){
      if(phase !== "racing") return;
      const maxSpeed = (nowTs < ai.boostUntil) ? 1.35 : 1;
      ai.theta += ai.angularSpeed * dt * maxSpeed;
      if(ai.theta > Math.PI) ai.theta -= Math.PI*2;
      const wob = Math.sin(nowTs/900 + ai.lateral*10) * 0.04;
      ai.x = RACE_CX + Math.cos(ai.theta) * RACE_RX * (ai.lateral+wob);
      ai.y = RACE_CY + Math.sin(ai.theta) * RACE_RY * (ai.lateral+wob);
      ai.angle = ai.theta + Math.PI/2;
      unwrapProgress(ai, ai.theta);
      checkBoost(ai, nowTs);
    }

    function drawTrack(){
      c2.clearRect(0,0,RACE_W,RACE_H);
      c2.fillStyle = "#DCE9B8";
      c2.fillRect(0,0,RACE_W,RACE_H);
      c2.fillStyle = "#9A9A94";
      c2.beginPath(); c2.ellipse(RACE_CX,RACE_CY,RACE_RX*1.3,RACE_RY*1.3,0,0,Math.PI*2); c2.fill();
      c2.fillStyle = "#DCE9B8";
      c2.beginPath(); c2.ellipse(RACE_CX,RACE_CY,RACE_RX*0.7,RACE_RY*0.7,0,0,Math.PI*2); c2.fill();
      c2.strokeStyle = "rgba(255,255,255,0.55)"; c2.lineWidth = 3; c2.setLineDash([10,10]);
      c2.beginPath(); c2.ellipse(RACE_CX,RACE_CY,RACE_RX,RACE_RY,0,0,Math.PI*2); c2.stroke();
      c2.setLineDash([]);

      c2.save();
      c2.translate(RACE_CX+RACE_RX, RACE_CY);
      c2.rotate(Math.PI/2);
      for(let i=-3;i<=3;i++){
        c2.fillStyle = i%2===0 ? "#3A2C22" : "#fff";
        c2.fillRect(i*8, -1.3*RACE_RY*0.3+40, 8, 12);
      }
      c2.restore();

      BOOST_PADS.forEach(theta => {
        c2.save();
        c2.fillStyle = "rgba(217,143,43,0.55)";
        c2.beginPath();
        c2.moveTo(RACE_CX,RACE_CY);
        c2.arc(RACE_CX, RACE_CY, RACE_RX*1.05, theta-BOOST_ARC, theta+BOOST_ARC);
        c2.closePath();
        c2.fill();
        c2.restore();
      });
    }

    function drawKart(k){
      c2.save();
      c2.translate(k.x, k.y);
      c2.rotate(k.angle);
      c2.fillStyle = "rgba(58,44,34,0.25)";
      c2.beginPath(); c2.ellipse(0,3,11,6,0,0,Math.PI*2); c2.fill();
      c2.fillStyle = k.color;
      roundRectPath(c2,-10,-6,20,12,4); c2.fill();
      c2.fillStyle = "#3A2C22";
      c2.fillRect(-9,-7,5,3); c2.fillRect(4,-7,5,3);
      c2.fillRect(-9,4,5,3); c2.fillRect(4,4,5,3);
      c2.restore();
    }

    function place(){
      const ranked = [player2, ai1, ai2].slice().sort((a,b)=>b.totalTheta-a.totalTheta);
      return ranked.indexOf(player2) + 1;
    }

    function drawHud(){
      c2.fillStyle = "rgba(58,44,34,0.75)";
      roundRect2(c2, 12, 12, 118, 52, 10); c2.fill();
      c2.fillStyle = "#F5E9D3";
      c2.font = "700 15px ui-rounded, sans-serif";
      c2.textAlign = "left";
      const lap = Math.min(LAPS_TOTAL, Math.max(1, Math.floor(player2.totalTheta/(Math.PI*2))+1));
      c2.fillText("Lap " + lap + " / " + LAPS_TOTAL, 22, 32);
      c2.fillText("Place " + place() + " / 3", 22, 52);
      if(phase === "countdown"){
        c2.fillStyle = "rgba(58,44,34,0.35)";
        c2.fillRect(0,0,RACE_W,RACE_H);
        c2.fillStyle = "#fff";
        c2.font = "800 64px ui-rounded, sans-serif";
        c2.textAlign = "center";
        c2.fillText(countdown > 0 ? String(countdown) : "GO!", RACE_W/2, RACE_H/2+20);
      }
    }

    function roundRect2(c,x,y,w,h,r){
      c.beginPath();
      c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
      c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
    }

    function frame(ts){
      if(last === null) last = ts;
      const dt = Math.min(0.05, (ts-last)/1000);
      last = ts;
      const nowTs = performance.now();

      if(phase === "racing"){
        updatePlayerKart(dt, nowTs);
        updateAiKart(ai1, dt, nowTs);
        updateAiKart(ai2, dt, nowTs);
      }

      drawTrack();
      [ai1, ai2, player2].forEach(drawKart);
      drawHud();

      if(phase === "racing" && player2.totalTheta >= LAPS_TOTAL*Math.PI*2){
        finishRace();
        return;
      }
      raf = requestAnimationFrame(frame);
    }

    function finishRace(){
      if(raceEnded) return;
      raceEnded = true;
      cancelAnimationFrame(raf);
      const pos = place();
      const rewards = { 1:45, 2:25, 3:10 };
      const money = rewards[pos] || 5;
      state.money += money;
      setEnergy(state.energy - 15);
      if(pos === 1) SFX.adopt(); else SFX.purchase();
      saveState(true);
      const ordinal = pos===1?"1st":pos===2?"2nd":"3rd";
      modalBody.innerHTML = `
        <h3>Go-Kart Stadium</h3>
        <div class="result-text">You finished ${ordinal}!</div>
        <div class="flavor-box">You earned $${money}.</div>
        <div class="action-row">
          <button class="action-btn ghost" id="race-again">Race Again</button>
          <button class="action-btn" id="race-done">Done</button>
        </div>
      `;
      document.getElementById("race-done").addEventListener("click", closeModal);
      document.getElementById("race-again").addEventListener("click", openStadium);
    }

    function cleanup(){
      gameMode = "town";
      clearInterval(countdownTimer);
      if(raf) cancelAnimationFrame(raf);
      raceEnded = true;
    }
    modalCleanup = cleanup;

    raf = requestAnimationFrame(frame);
  }

  /* ---------- Arcade: Pixel Quest platformer ---------- */
  const ARC_W = 700, ARC_H = 380;
  const LEVEL_W = 2200;
  const GROUND_Y = 300;
  const GROUND_SPANS = [[0,480],[560,1000],[1080,1500],[1580,2200]];
  const PLATFORMS = [ {x:650,y:220,w:100,h:16}, {x:1150,y:200,w:100,h:16}, {x:1700,y:230,w:100,h:16} ];
  const GOAL_X = 2150;

  function openArcade(){
    if(state.energy < 12){
      openModal(`<h3>Arcade — Pixel Quest</h3><div class="flavor-box">You're too tired for the arcade right now. Head home and sleep to restore energy.</div>`);
      return;
    }
    openModal(`
      <h3>Arcade — Pixel Quest</h3>
      <p class="modal-sub">No timer, no lives — just hop, collect coins, and reach the flag.</p>
      <div class="mg-scoreline"><span>Coins: <b id="pq-coins">0</b></span><span id="pq-msg"></span></div>
      <div class="race-wrap"><canvas id="pq-canvas" width="${ARC_W}" height="${ARC_H}"></canvas></div>
      <div class="hint" style="margin-top:0.6rem;">Left/Right or A/D: Move · Up/Space: Jump</div>
    `);
    startPlatformer();
  }

  function startPlatformer(){
    gameMode = "arcade";
    const canvas3 = document.getElementById("pq-canvas");
    const c3 = canvas3.getContext("2d");
    const coinsEl = document.getElementById("pq-coins");
    const msgEl = document.getElementById("pq-msg");

    const p3 = { x:40, y:250, vx:0, vy:0, onGround:false, w:22, h:26, facing:1, invincibleUntil:0 };
    let lastSafeX = 40;
    let coinsCollected = 0;
    let finished = false;
    let ended = false;
    let camX = 0;
    let raf3 = null, last3 = null;

    const coins = [];
    for(let i=0;i<16;i++){
      const x = 120 + i*130 + (i%3)*20;
      const plat = PLATFORMS.find(pl => x > pl.x-10 && x < pl.x+pl.w+10);
      const y = plat ? plat.y-22 : GROUND_Y-26;
      coins.push({x, y, got:false});
    }
    const enemies = [
      { x:750, minX:600, maxX:950, y:GROUND_Y, dir:1, alive:true },
      { x:1250, minX:1090, maxX:1450, y:GROUND_Y, dir:-1, alive:true },
      { x:1900, minX:1620, maxX:2150, y:GROUND_Y, dir:1, alive:true },
    ];

    function onSolidGroundAt(x){
      return GROUND_SPANS.some(([a,b]) => x > a+10 && x < b-10);
    }

    function frame(ts){
      if(last3 === null) last3 = ts;
      const dt = Math.min(0.033, (ts-last3)/1000);
      last3 = ts;
      const nowTs = performance.now();

      if(!finished){
        let vx = 0;
        if(keys.left) vx = -210;
        if(keys.right) vx = 210;
        p3.vx = vx;
        if(vx !== 0) p3.facing = vx > 0 ? 1 : -1;
        if(keys.up && p3.onGround){ p3.vy = -560; p3.onGround = false; SFX.jump(); }

        p3.vy += 1500*dt;
        p3.x += p3.vx*dt;
        p3.y += p3.vy*dt;
        p3.x = Math.max(14, Math.min(LEVEL_W-14, p3.x));

        p3.onGround = false;
        if(p3.vy >= 0){
          if(onSolidGroundAt(p3.x) && p3.y+p3.h/2 >= GROUND_Y){
            p3.y = GROUND_Y - p3.h/2; p3.vy = 0; p3.onGround = true; lastSafeX = p3.x;
          }
          PLATFORMS.forEach(pl => {
            if(p3.x > pl.x-4 && p3.x < pl.x+pl.w+4 && p3.y+p3.h/2 >= pl.y && p3.y+p3.h/2 <= pl.y+14){
              p3.y = pl.y - p3.h/2; p3.vy = 0; p3.onGround = true; lastSafeX = p3.x;
            }
          });
        }
        if(p3.y > ARC_H+120){
          p3.x = lastSafeX; p3.y = GROUND_Y-40; p3.vy = 0;
        }

        coins.forEach(c => {
          if(!c.got && Math.hypot(p3.x-c.x, p3.y-c.y) < 22){
            c.got = true; coinsCollected++; coinsEl.textContent = coinsCollected; SFX.hit();
          }
        });

        enemies.forEach(en => {
          if(!en.alive) return;
          en.x += en.dir * 55 * dt;
          if(en.x < en.minX || en.x > en.maxX) en.dir *= -1;
          const dx = Math.abs(p3.x-en.x), dy = p3.y-en.y;
          if(dx < 20 && dy < 4 && dy > -22){
            if(p3.vy > 40 && p3.y < en.y-4){
              en.alive = false; p3.vy = -360; SFX.hit();
              msgEl.textContent = "Stomped!";
            } else if(nowTs > p3.invincibleUntil){
              coinsCollected = Math.max(0, coinsCollected-2);
              coinsEl.textContent = coinsCollected;
              p3.invincibleUntil = nowTs + 1200;
              p3.vx = -p3.facing*150; p3.vy = -200;
              msgEl.textContent = "Ouch!";
              SFX.bark();
            }
          }
        });

        if(p3.x > GOAL_X - 10){
          finished = true;
          finishPlatformer();
        }
      }

      camX = Math.max(0, Math.min(LEVEL_W-ARC_W, p3.x - ARC_W/2));
      drawPlatformerScene(c3, camX, p3, coins, enemies, nowTs);

      if(!ended) raf3 = requestAnimationFrame(frame);
    }

    function cleanup(){
      ended = true;
      gameMode = "town";
      if(raf3) cancelAnimationFrame(raf3);
    }
    modalCleanup = cleanup;

    function finishPlatformer(){
      cleanup();
      const money = coinsCollected*2 + 20;
      state.money += money;
      setEnergy(state.energy - 12);
      SFX.adopt();
      saveState(true);
      const root = document.getElementById("pq-canvas").parentElement.parentElement;
      root.innerHTML = `
        <h3>Arcade — Pixel Quest</h3>
        <div class="result-text">Level clear! ${coinsCollected} coins collected.</div>
        <div class="flavor-box">You earned $${money}.</div>
        <div class="action-row">
          <button class="action-btn ghost" id="pq-again">Play Again</button>
          <button class="action-btn" id="pq-done">Done</button>
        </div>
      `;
      document.getElementById("pq-done").addEventListener("click", closeModal);
      document.getElementById("pq-again").addEventListener("click", openArcade);
    }

    raf3 = requestAnimationFrame(frame);
  }

  function drawPlatformerScene(c3, camX, p3, coins, enemies, nowTs){
    c3.clearRect(0,0,ARC_W,ARC_H);
    const grad = c3.createLinearGradient(0,0,0,ARC_H);
    grad.addColorStop(0, "#BFE3EE"); grad.addColorStop(1, "#E8F3D9");
    c3.fillStyle = grad; c3.fillRect(0,0,ARC_W,ARC_H);

    c3.save();
    c3.translate(-camX, 0);

    GROUND_SPANS.forEach(([a,b]) => {
      c3.fillStyle = "#8FB07A";
      c3.fillRect(a, GROUND_Y, b-a, 14);
      c3.fillStyle = "#B5654A";
      c3.fillRect(a, GROUND_Y+14, b-a, ARC_H-GROUND_Y-14);
    });

    PLATFORMS.forEach(pl => {
      c3.fillStyle = "#C9A574";
      roundRectPath(c3, pl.x, pl.y, pl.w, pl.h, 5); c3.fill();
    });

    coins.forEach(c => {
      if(c.got) return;
      const bob = Math.sin(nowTs/220 + c.x) * 3;
      c3.fillStyle = "#E8A33D";
      c3.beginPath(); c3.arc(c.x, c.y+bob, 8, 0, Math.PI*2); c3.fill();
      c3.strokeStyle = "#B5651D"; c3.lineWidth = 1.5;
      c3.beginPath(); c3.arc(c.x, c.y+bob, 8, 0, Math.PI*2); c3.stroke();
    });

    enemies.forEach(en => {
      if(!en.alive) return;
      c3.fillStyle = "#8A5A8C";
      c3.beginPath(); c3.ellipse(en.x, en.y-8, 13, 11, 0, 0, Math.PI*2); c3.fill();
      c3.fillStyle = "#fff";
      c3.beginPath(); c3.arc(en.x-4, en.y-10, 2.4, 0, Math.PI*2); c3.fill();
      c3.beginPath(); c3.arc(en.x+4, en.y-10, 2.4, 0, Math.PI*2); c3.fill();
      c3.fillStyle = "#3A2C22";
      c3.beginPath(); c3.arc(en.x-4, en.y-10, 1.1, 0, Math.PI*2); c3.fill();
      c3.beginPath(); c3.arc(en.x+4, en.y-10, 1.1, 0, Math.PI*2); c3.fill();
    });

    c3.save();
    c3.strokeStyle = "#8C5A3B"; c3.lineWidth = 4;
    c3.beginPath(); c3.moveTo(GOAL_X, GROUND_Y); c3.lineTo(GOAL_X, GROUND_Y-90); c3.stroke();
    c3.fillStyle = "#E8A33D";
    c3.beginPath(); c3.moveTo(GOAL_X, GROUND_Y-90); c3.lineTo(GOAL_X+34, GROUND_Y-76); c3.lineTo(GOAL_X, GROUND_Y-62); c3.closePath(); c3.fill();
    c3.restore();

    const blink = nowTs < p3.invincibleUntil && Math.floor(nowTs/100)%2===0;
    if(!blink){
      c3.save();
      c3.translate(p3.x, p3.y);
      c3.fillStyle = "rgba(58,44,34,0.2)";
      c3.beginPath(); c3.ellipse(0, p3.h/2+3, 11, 4, 0, 0, Math.PI*2); c3.fill();
      c3.fillStyle = state.child.outfit;
      roundRectPath(c3, -p3.w/2, -4, p3.w, p3.h-6, 7); c3.fill();
      c3.beginPath(); c3.arc(0, -p3.h/2-2, 10, 0, Math.PI*2); c3.fillStyle = state.child.skin; c3.fill();
      c3.fillStyle = "#3A2C22";
      c3.beginPath(); c3.arc(p3.facing*3, -p3.h/2-3, 1.4, 0, Math.PI*2); c3.fill();
      c3.restore();
    }
    c3.restore();
  }

  /* ---------- Save controls ---------- */
  document.getElementById("btn-save").addEventListener("click", () => saveState(false));
  document.getElementById("btn-load").addEventListener("click", () => {
    const loaded = loadState();
    if(loaded){ state = loaded; updateHud(); toast("Game loaded"); }
    else toast("No saved game found");
  });
  document.getElementById("btn-new").addEventListener("click", () => {
    if(confirm("Start a new game? This will erase your current progress.")){
      localStorage.removeItem(SAVE_KEY);
      state = defaultState();
      puppyTrail.length = 0;
      updateHud();
      toast("New game started");
    }
  });

  /* ---------- Init ---------- */
  updateHud();
  requestAnimationFrame(loop);
  window.addEventListener("beforeunload", () => saveState(true));
})();
</script>
